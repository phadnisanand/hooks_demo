custom_hooks_demo.page:
  path: '/custom-hooks-demo-cron'
  defaults:
    _title: 'Run all crons'
    _controller: '\Drupal\custom_hooks_demo\Controller\CustomHooksDemoController::customRunAllCrons'
  requirements:
     _access: 'TRUE'

custom_hooks_demo.renderdata:
  path: '/custom-hooks-render-data'
  defaults:
    _title: 'Hooks demo'
    _controller: '\Drupal\custom_hooks_demo\Controller\CustomHooksDemoController::renderData'
  requirements:
     _access: 'TRUE'
